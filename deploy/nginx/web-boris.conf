# Vhost de la web en el nginx del VPS. Sustituir SERVER_NAME por el host público (deploy/README en docs/deploy/vps.md).
# Solo HTTP: `certbot --nginx -d SERVER_NAME` añade después el bloque 443 y la redirección a HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # Vista previa para Boris: que no la indexen los buscadores. Quitar cuando haya dominio definitivo.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3131;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # El límite de votos de /comunidad agrupa por la IP del cliente: X-Real-IP es obligatorio.
        # X-Forwarded-For se sobrescribe (no se añade) para que el cliente no pueda inventarse una IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Streaming de React (loading.tsx, Suspense): sin búfer en el proxy.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
