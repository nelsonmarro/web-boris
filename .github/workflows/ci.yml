name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Base desechable para los tests de integración del panel (`tests/integration/`, `TEST_DATABASE_URL`).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: webboris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d webboris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores dummy: el build no se conecta a la base de datos ni envía correos.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-secret-not-for-production
      AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_dummy
      CONTACT_EMAIL: ci@example.com
      VOTE_SECRET: ci-dummy-vote-secret-0123456789abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3131
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/webboris_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # El cliente de Prisma (prisma-client-js) no se versiona: hay que generarlo.
      - run: npx prisma generate

      - run: npm run lint

      # Migra la base de pruebas: sin esto los tests de integración no tienen tablas.
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/webboris_test

      - run: npm test

      - run: npm run check:content

      - run: npm run build
