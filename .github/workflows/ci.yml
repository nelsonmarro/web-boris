name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores dummy: el build no se conecta a la base de datos ni envía correos.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-secret-not-for-production
      AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_dummy
      CONTACT_EMAIL: ci@example.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3131
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # El cliente de Prisma (prisma-client-js) no se versiona: hay que generarlo.
      - run: npx prisma generate

      - run: npm run lint

      - run: npm run check:content

      - run: npm run build
